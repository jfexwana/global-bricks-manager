<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Principal - Gestion LEGO</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<script src="unified-data-manager.js"></script>
<script type="module">
  import LocalStorageManager from './auth.js';

  document.addEventListener('DOMContentLoaded', async function() {
    // UnifiedDataManager est déjà chargé et initialisé par unified-data-manager.js
    // Pas besoin de new UnifiedDataManager() ni de loadUnifiedData()

    class UnifiedStorageManager extends LocalStorageManager {
      constructor(container) {
        super(container);
      }

      exportToFile() {
        try {
          const json = UnifiedDataManager.exportData();
          const blob = new Blob([json], { type: 'application/json' });
          const url  = URL.createObjectURL(blob);
          const a    = document.createElement('a');
          a.href     = url;
          a.download = `lego_backup_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error('Erreur export:', error);
          alert('Erreur lors de l\'export des données');
        }
      }

      async importFromFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          if (confirm('Voulez-vous vraiment importer ces données ? Cela remplacera vos données actuelles.')) {
            UnifiedDataManager.importData(text);
            alert('Données importées avec succès ! Rechargez la page pour voir les changements.');
          }
        } catch (error) {
          console.error('Erreur lors de l\'import:', error);
          alert('Erreur lors de l\'import : fichier invalide');
        }
        event.target.value = '';
      }
    }

    // Initialiser la section stockage
    const storageContainer = document.getElementById('storage-container');
    if (storageContainer) {
      new UnifiedStorageManager(storageContainer);
    }

    // Initialiser la section API
    updateUIFromStoredData();
  });

  function updateUIFromStoredData() {
    const apiKeyInput = document.getElementById('api-key');
    const apiStatus   = document.getElementById('api-status');
    if (apiKeyInput && apiStatus) {
      const savedApiKey = UnifiedDataManager.getApiKey();
      if (savedApiKey) {
        apiKeyInput.value    = savedApiKey;
        apiStatus.textContent = 'Configurée';
        apiStatus.className   = 'status status-connected';
      }
    }
  }

  function saveApiKey() {
    const apiKeyInput = document.getElementById('api-key');
    const apiStatus   = document.getElementById('api-status');
    if (!apiKeyInput || !apiStatus) {
      alert('Erreur: éléments d\'interface non trouvés');
      return;
    }
    const apiKey = apiKeyInput.value.trim();
    if (apiKey) {
      UnifiedDataManager.setApiKey(apiKey);
      apiStatus.textContent = 'Configurée';
      apiStatus.className   = 'status status-connected';
      alert('Clé API enregistrée avec succès!');
    } else {
      alert('Veuillez entrer une clé API valide');
    }
  }

  window.saveApiKey     = saveApiKey;
  window.goToBulkParts  = () => { window.location.href = 'app.html'; };
  window.goToSets       = () => { window.location.href = 'sets.html'; };
  window.goToFileManager = () => { window.location.href = 'index.html'; };
</script>

  <style>

  </style>
</head>
<body>
  <div class="container">
    <h1>Menu Principal - Gestion LEGO</h1>
    
    <div class="api-section">
      <h3>Clé API Rebrickable</h3>
      <div id="api-status" class="status status-disconnected">Non configurée</div>
      <input type="text" id="api-key" placeholder="Entrez votre clé API Rebrickable">
      <button class="btn btn-api" onclick="saveApiKey()">Enregistrer la clé API</button>
    </div>
    
    <div class="storage-section">
      <h3>Sauvegarde & Export</h3>
      <div id="storage-container"></div>
    </div>
    
    <div class="menu-options">
      <div class="menu-card" onclick="goToBulkParts()">
        <div class="menu-title">Mes Pièces en Vrac</div>
        <div class="menu-description">Accédez à votre inventaire de pièces LEGO en vrac, triez par catégories et gérez vos quantités.</div>
        <button class="btn">Ouvrir</button>
      </div>
      
      <div class="menu-card" onclick="goToSets()">
        <div class="menu-title">Mes Sets</div>
        <div class="menu-description">Gérez vos sets LEGO complets, suivez votre collection et vos projets de construction.</div>
        <button class="btn">Ouvrir</button>
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 30px;">
      <button class="btn btn-back" onclick="goToFileManager()">Retour à la gestion des fichiers</button>
    </div>
  </div>
</body>
</html>
