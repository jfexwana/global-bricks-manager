    // Obtenir les catégories depuis IndexedDB
    async function getLocalCategories() {
  try {
    const categories = await db.getData('part_categories');
    const categoriesWithCounts = [];
    
    for (const cat of categories) {
      // Utiliser d'abord les métadonnées, puis la fonction en fallback
      let partCount = await db.getMetadata(`category_${cat.id}_count`);
      if (!partCount) {
        partCount = await getPartCountForCategory(cat.id);
      }
      
      const setCount = await db.getMetadata(`category_${cat.id}_set_count`) || 0;
      
      if (partCount > 0) {
        categoriesWithCounts.push({
          id: cat.id,
          name: cat.name,
          num_parts: partCount,
          num_sets: setCount, // Nouveau
          keywords: generateKeywordsForCategory(cat.id)
        });
      }
    }
    
    // Trier par nombre de sets d'abord, puis par nombre de pièces
    return categoriesWithCounts.sort((a, b) => {
      if (b.num_sets !== a.num_sets) {
        return b.num_sets - a.num_sets;
      }
      return b.num_parts - a.num_parts;
    });
  } catch (error) {
    console.error('Erreur lors du chargement des catégories:', error);
    return [];
  }
}

    // Obtenir les pièces d'une catégorie depuis IndexedDB
async function getLocalPartsByCategory(categoryId) {
  try {
    const parts = await db.getDataByIndex('parts', 'part_cat_id', categoryId);
    
    // Enrichir avec les compteurs de sets et trier
    const partsWithSetCount = await Promise.all(
      parts.map(async (part) => {
        const setCount = await db.getMetadata(`part_${part.part_num}_set_count`) || 0;
        return {
          ...part,
          set_count: setCount
        };
      })
    );
    
    // Trier par nombre de sets (décroissant)
    return partsWithSetCount.sort((a, b) => b.set_count - a.set_count);
  } catch (error) {
    console.error(`Erreur lors du chargement des pièces pour la catégorie ${categoryId}:`, error);
    return [];
  }
}

// Obtenir les couleurs disponibles pour une pièce
async function getPartColors(partNum) {
  try {
    // Récupérer toutes les entrées inventory_parts pour cette pièce
    const inventoryParts = await db.getDataByIndex('inventory_parts', 'part_num', partNum);
    
    if (inventoryParts.length === 0) {
      return [{
        id: 0,
        name: 'Noir',
        img_url: `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`
      }];
    }
    
    // Extraire les color_id uniques (INCLURE le 0)
    const colorIds = [...new Set(inventoryParts.map(item => item.color_id))].filter(id => 
      id !== null && id !== undefined && id !== '' // Ne pas filtrer le 0
    );
    
    // Récupérer les informations de couleur depuis la table colors
    const allColors = await db.getData('colors');
    const colorMap = new Map();
    
    allColors.forEach(color => {
      colorMap.set(color.id, color);
    });
    
    // Construire le résultat avec les URLs d'images
    const colors = [];
    for (const colorId of colorIds) {
      const colorInfo = colorMap.get(colorId);
      
      // Trouver une URL d'image pour cette combinaison part_num + color_id
      const inventoryItem = inventoryParts.find(item => item.color_id === colorId);
      
      if (colorInfo) {
        colors.push({
          id: colorId,
          name: colorInfo.name,
          img_url: inventoryItem?.img_url || `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`
        });
      } else if (colorId === 0) {
        // Cas spécial pour la couleur 0 (Noir) si non trouvée dans colors.csv
        colors.push({
          id: 0,
          name: 'Noir',
          img_url: inventoryItem?.img_url || `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`
        });
      }
    }
    
    // Si aucune couleur trouvée, retourner la couleur standard
    return colors.length > 0 ? colors : [{
      id: 0,
      name: 'Noir',
      img_url: inventoryParts[0]?.img_url || `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`
    }];
  } catch (error) {
    console.error(`Erreur récupération couleurs pour ${partNum}:`, error);
    return [{
      id: 0,
      name: 'Noir',
      img_url: `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`
    }];
  }
}

    // Obtenir l'URL de l'image d'une pièce
async function getPartImageUrl(part) {
  if (!part || !part.part_num) {
    return 'https://via.placeholder.com/100x100?text=No+Image';
  }
  
  // Vérifier le cache d'abord
  const cacheKey = `part_${part.part_num}`;
  if (imageCache.has(cacheKey)) {
    return imageCache.get(cacheKey);
  }

  try {
    const inventoryParts = await db.getDataByIndex('inventory_parts', 'part_num', part.part_num);
    let imageUrl;
    
    if (inventoryParts.length > 0 && inventoryParts[0].img_url) {
      imageUrl = inventoryParts[0].img_url;
      
      // Tester si l'image fonctionne
      const isValid = await testImageUrl(imageUrl);
      if (!isValid) {
        console.warn(`Image cassée pour ${part.part_num}`);
        imageUrl = `https://cdn.rebrickable.com/media/parts/elements/${part.part_num}.jpg`;
      }
    } else {
      imageUrl = `https://cdn.rebrickable.com/media/parts/elements/${part.part_num}.jpg`;
    }
    
    // Mettre en cache
    imageCache.set(cacheKey, imageUrl);
    return imageUrl;
  } catch (error) {
    console.warn(`Erreur lors de la recherche d'image pour ${part.part_num}:`, error);
    const fallbackUrl = `https://cdn.rebrickable.com/media/parts/elements/${part.part_num}.jpg`;
    imageCache.set(cacheKey, fallbackUrl);
    return fallbackUrl;
  }
}

// Fonction pour vérifier si une pièce manque dans un set (CORRIGÉE)
async function checkIfPartIsMissingInSets(partNum, colorId) {
  try {
    if (!unifiedDataManager || !unifiedDataManager.currentData.sets) return false;
    
    const missingSets = [];
    
    for (const set of unifiedDataManager.currentData.sets) {
      if (set.parts && Array.isArray(set.parts)) {
        for (const part of set.parts) {
          // Utiliser la structure unifiée : part_num, color_id, quantity, quantity_owned
          if (part.part_num === partNum && part.color_id == colorId) {
            const quantityOwned = part.quantity_owned || 0;
            if (quantityOwned < part.quantity) {
              missingSets.push({
                setNumber: set.number,
                setName: set.name,
                missingCount: part.quantity - quantityOwned
              });
            }
          }
        }
      }
    }
    
    return missingSets.length > 0 ? missingSets : false;
  } catch (error) {
    console.error('Erreur vérification pièces manquantes:', error);
    return false;
  }
}


// Modifier la fonction changeQuantity pour utiliser color_id
async function changeQuantity(partNum, partName, categoryName, colorId, colorName, delta) {
  const currentQty = unifiedDataManager.getInventoryQuantity(partNum, colorId);
  const newQty = Math.max(0, currentQty + delta);
  
  // Utiliser directement le gestionnaire unifié
  unifiedDataManager.updateInventory(partNum, colorId, colorName, newQty, categoryName);
unifiedDataManager.scheduleSave();  
  // Vérifier si cette pièce manque dans un set
  if (delta > 0) {
    const missingSets = await checkIfPartIsMissingInSets(partNum, colorId);
    if (missingSets && missingSets.length > 0) {
      const setsList = missingSets.map(s => `${s.setNumber} (${s.missingCount} manquant${s.missingCount > 1 ? 's' : ''})`).join(', ');
      showToast(`Pièce manquante dans le${missingSets.length > 1 ? 's' : ''} set${missingSets.length > 1 ? 's' : ''}: ${setsList}. Vérifiez Mon inventaire`, 'warning', 6000);
    }
  }
  
  // Mettre à jour l'affichage
  const qtyElement = document.getElementById(`qty_${partNum}_${colorId}`);
  if (qtyElement) {
    qtyElement.textContent = newQty;
  }
  
  const globalQtyElement = document.getElementById(`global_qty_${partNum}_${colorId}`);
  if (globalQtyElement) {
    globalQtyElement.textContent = newQty;
  }
}

// Fonction pour échapper les caractères HTML (IMPORTANT)
function escapeHTML(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Fonction pour afficher des notifications toast
function showToast(message, type = 'info', duration = 3000) {
  // Créer un élément toast si nécessaire
  let toastContainer = document.querySelector('.toast-container');
  if (!toastContainer) {
    toastContainer = document.createElement('div');
    toastContainer.className = 'toast-container';
    document.body.appendChild(toastContainer);
  }
  
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-content">${message}</div>
  `;
  
  toastContainer.appendChild(toast);
  
  // Afficher le toast
  setTimeout(() => {
    toast.classList.add('show');
  }, 100);
  
  // Cacher après la durée spécifiée
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => {
      toast.remove();
    }, 300);
  }, duration);
}

   // Filtrer les pièces selon les mots-clés actifs et le filtre print
function filterParts(parts, filters, printFilterValue) {
  let filtered = parts;
  const keywords = ['print', 'logo', 'pattern', 'label', 'sticker', 'poster', 'writing', 'graffiti'];

  if (printFilterValue === 'print' || printFilterValue === 'sticker') {
    filtered = filtered.filter(part => {
      const partName = (part.name || '').toLowerCase();
      return keywords.some(keyword => partName.includes(keyword));
    });
  } else if (printFilterValue === 'no-print') {
    filtered = filtered.filter(part => {
      const partName = (part.name || '').toLowerCase();
      return !keywords.some(keyword => partName.includes(keyword));
    });
  }

  if (filters.length === 0) return filtered;

  return filtered.filter(part => {
    const searchText = ((part.name || '') + ' ' + (part.part_num || '')).toLowerCase();
    return filters.every(filter =>
      searchText.includes(filter.toLowerCase())
    );
  });
}

// Exécuter une recherche globale
async function executeGlobalSearch() {
  const globalSearchInput = document.getElementById('global-search');
  if (!globalSearchInput) return; // Vérifier que l'élément existe
  
const query = globalSearchInput.value.trim();
  if (!query) return;
  
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading">Recherche globale en cours...</div>`;
  
  try {
    // Rechercher dans toutes les pièces de toutes les catégories
    const allParts = await db.getData('parts');
    const searchResults = performAdvancedSearch(allParts, query);
    
    if (searchResults.length === 0) {
      app.innerHTML = `
        <div class="error">
          <h3>Aucun résultat trouvé</h3>
          <p>Aucune pièce ne correspond à votre recherche : "${query}"</p>
          <button class="btn" onclick="showCategories()">Retour aux catégories</button>
        </div>
      `;
      return;
    }
    
    // Ajouter la recherche comme filtre temporaire global
    const filterId = 'global_search_' + Date.now();
    const newFilter = {
      id: filterId,
      query: query,
      count: searchResults.length,
      isGlobal: true,
      results: searchResults
    };
    
    temporaryFilters = [newFilter]; // Remplacer les filtres existants
    
    // Afficher les résultats groupés par catégorie
    await showGlobalSearchResultsGrouped(searchResults);
    
  } catch (error) {
    console.error('Erreur recherche globale:', error);
    app.innerHTML = `
      <div class="error">
        <h3>Erreur de recherche</h3>
        <p>Une erreur s'est produite lors de la recherche.</p>
        <button class="btn" onclick="showCategories()">Retour aux catégories</button>
      </div>
    `;
  }
}

// Exécuter une recherche dans la catégorie courante
function executeCategorySearch() {
  const categorySearchInput = document.getElementById('category-search');
  if (!categorySearchInput) return; // Vérifier que l'élément existe
  
  const query = categorySearchInput.value.trim();
  if (!query) return; // Ne rien faire si la requête est vide

// Vérifier si ce filtre existe déjà 
  const existingFilter = temporaryFilters.find(f => f.query === query && !f.isGlobal);
  if (existingFilter) {
    alert('Cette recherche est déjà active');
    categorySearchInput.value = '';
    return;
  }

  // Effectuer la recherche sur les pièces actuelles de la catégorie
  const searchResults = performAdvancedSearch(allParts, query);

  // Ajouter comme filtre temporaire
  const filterId = 'category_search_' + Date.now();
  const newFilter = {
    id: filterId,
    query: query,
    count: searchResults.length,
    results: searchResults,
    isGlobal: false,

  };
  
  temporaryFilters.push(newFilter);
  
  // Effacer le champ de recherche
  categorySearchInput.value = '';
  
  // Reappliquer les filtres
  applyFilters();
}

async function showGlobalSearchResultsGrouped(searchResults) {
  const app = document.getElementById('app');
  
  // Récupérer les catégories et grouper les résultats
  const categories = await db.getData('part_categories');
  const categoryMap = new Map();
  
  categories.forEach(cat => {
    categoryMap.set(cat.id, { ...cat, parts: [] });
  });

// Affiner la recherche globale
async function executeGlobalSearchRefine() {
  const refineInput = document.getElementById('global-search-refine');
  if (!refineInput) return; // Vérifier que l'élément existe
  
  const query = refineInput.value.trim();
  if (!query) return;

  // Ajouter le nouveau filtre
  const filterId = 'global_refine_' + Date.now();
  const newFilter = {
    id: filterId,
    query: query,
    count: 0, // Sera calculé
    isGlobal: true
  };
  
  temporaryFilters.push(newFilter);
  
  // Effacer le champ
  refineInput.value = '';
  
  // Recalculer les résultats
  await applyGlobalFilters();
}

// Appliquer les filtres temporaires globaux
async function applyGlobalFilters() {
  let filtered = await db.getData('parts');
  
  // Appliquer tous les filtres temporaires
  for (const tempFilter of temporaryFilters) {
    filtered = performAdvancedSearch(filtered, tempFilter.query);
  }
  
  // Mettre à jour les compteurs
  for (const filter of temporaryFilters) {
    filter.count = performAdvancedSearch(await db.getData('parts'), filter.query).length;
  }
  
  // Réafficher les résultats
  await showGlobalSearchResultsGrouped(filtered);
}

// Basculer un filtre temporaire global
async function toggleGlobalTemporaryFilter(filterId) {
  const filterIndex = temporaryFilters.findIndex(f => f.id === filterId);
  if (filterIndex > -1) {
    temporaryFilters.splice(filterIndex, 1);
    
    if (temporaryFilters.length === 0) {
      showCategories();
    } else {
      await applyGlobalFilters();
    }
  }
}

// Gérer le clic sur une pièce dans les résultats globaux

  const colorsData = partDiv.getAttribute('data-colors');
  
  if (!colorsData) return;
  
  const colors = JSON.parse(colorsData);
  
  if (colors.length === 0) {
    alert('Aucune couleur disponible pour cette pièce');
    return;
  }
  
  if (colors.length === 1) {
    return; // Les boutons +/- sont déjà affichés
  }
  
  // Plusieurs couleurs, afficher le popup
  showColorPopup({part_num: partNum, name: partName}, categoryName, colors);
}

// Grouper les résultats par catégorie
async function groupResultsByCategory(searchResults) {
  const categories = await db.getData('part_categories');
  const categoryMap = new Map();
  
  categories.forEach(cat => {
    categoryMap.set(cat.id, { ...cat, parts: [] });
  });
  
  searchResults.forEach(part => {
    const category = categoryMap.get(part.part_cat_id);
    if (category) {
      category.parts.push(part);
    }

  return Array.from(categoryMap.values()).filter(cat => cat.parts.length > 0);

function showSearchResultsInCategory(categoryId, categoryName, query) {
  currentCategory = { id: categoryId, name: categoryName };
  
  // Ajouter la recherche comme filtre temporaire
  const filterId = 'global_search_' + Date.now();
  const newFilter = {
    id: filterId,
    query: query,
    count: 0, // Sera mis à jour
    isGlobal: true
  };
  
  temporaryFilters = [newFilter]; // Remplacer les filtres existants
  activeFilters = [];
  printFilter = 'all';
  currentPage = 1;
  
  loadCategoryParts();
}

// Basculer un filtre temporaire
function toggleTemporaryFilter(filterId) {
  const filterIndex = temporaryFilters.findIndex(f => f.id === filterId);
  if (filterIndex > -1) {
    temporaryFilters.splice(filterIndex, 1);
    applyFilters();
  }
}

// Modifier applyFilters pour inclure les filtres temporaires
function applyFilters() {
  let filtered = allParts;
  
  // Appliquer les filtres temporaires
  if (temporaryFilters.length > 0) {
    for (const tempFilter of temporaryFilters) {
      if (tempFilter.isGlobal) {
        // Pour les recherches globales, filtrer par la requête
        filtered = performAdvancedSearch(filtered, tempFilter.query);
      } else {
        // Pour les recherches locales, utiliser les résultats stockés
        const partNums = new Set(tempFilter.results.map(p => p.part_num));
        filtered = filtered.filter(part => partNums.has(part.part_num));
      }
    }
  }
  
  // Appliquer les autres filtres existants
  filteredParts = filterParts(filtered, activeFilters, printFilter);
  
  // Mettre à jour le nombre de résultats dans les filtres temporaires
  temporaryFilters.forEach(filter => {
    if (!filter.isGlobal) {
      filter.count = filter.results.filter(part => 
        filteredParts.some(fp => fp.part_num === part.part_num)
      ).length;
    }
  });
  
  totalPages = Math.ceil(filteredParts.length / 100);
  currentPage = Math.min(currentPage, Math.max(1, totalPages));
  showCategoryParts();
}

function clearCategorySearch() {
  temporaryFilters = [];
  applyFilters();
}

    // Changer le filtre print
    function setPrintFilter(value) {
      printFilter = value;
      currentPage = 1;
      applyFilters();
    }

    // Activer/désactiver un filtre par mot-clé
    function toggleFilter(keyword) {
      const index = activeFilters.indexOf(keyword);
      if (index > -1) {
        activeFilters.splice(index, 1);
      } else {
        activeFilters.push(keyword);
      }
      applyFilters();
    }

    // Effacer tous les filtres
    function clearAllFilters() {
      activeFilters = [];
      printFilter = 'no-print';
      applyFilters();
    }

function getMissingPartsInfo() {
  const missingInfo = {};
  
  try {
    if (!unifiedDataManager || !unifiedDataManager.currentData.sets) return missingInfo;
    
    // Parcourir tous les sets du format unifié
    for (const set of unifiedDataManager.currentData.sets) {
      if (set.parts && Array.isArray(set.parts)) {
        for (const part of set.parts) {
          const quantityOwned = part.quantity_owned || 0;
          if (quantityOwned < part.quantity) {
            // Utiliser la structure unifiée
            const key = `${part.part_num}_${part.color_id}`;
            if (!missingInfo[key]) {
              missingInfo[key] = {
                partNum: part.part_num,
                colorId: part.color_id,
                colorName: part.color_name || 'Couleur inconnue',
                sets: []
              };
            }
            
            missingInfo[key].sets.push({
              setNumber: set.number,
              setName: set.name,
              needed: part.quantity,
              owned: quantityOwned,
              missing: part.quantity - quantityOwned
            });
          }
        }
      }
    }
  } catch (error) {
    console.error('Erreur récupération pièces manquantes:', error);
  }
  
  return missingInfo;
}

// Fonction pour valider une image via l'API
async function validateImageViaAPI(partNum, colorId) {
  try {
    // Essayer d'abord avec l'endpoint général de la pièce
    const response = await fetch(`${BASE_URL}parts/${partNum}/?key=${API_KEY}`);
    if (response.ok) {
      const partData = await response.json();
      if (partData.part_img_url) {
        const isValid = await checkImageExists(partData.part_img_url);
        if (isValid) {
          return partData.part_img_url;
        }
      }
    }
    
    // Si pas d'image générale ou cassée, essayer avec la couleur
    if (colorId && colorId !== 0) {
      const colorResponse = await fetch(`${BASE_URL}parts/${partNum}/colors/${colorId}/?key=${API_KEY}`);
      if (colorResponse.ok) {
        const colorData = await colorResponse.json();
        if (colorData.elements && colorData.elements.length > 0) {
          const elementImg = colorData.elements[0].part_img_url;
          if (elementImg) {
            const isValid = await checkImageExists(elementImg);
            if (isValid) {
              return elementImg;
            }
          }
        }
      }
    }
    
    return null;
  } catch (error) {
    console.warn(`Erreur validation API pour ${partNum}:`, error);
    return null;
  }
}

// Fonction pour mettre à jour l'URL d'image dans IndexedDB
async function updateImageInDB(partNum, colorId, newUrl) {
  return new Promise((resolve, reject) => {
    try {
      const transaction = db.db.transaction(['inventory_parts'], 'readwrite');
      const store = transaction.objectStore('inventory_parts');
      const index = store.index('part_num');
      
      const request = index.getAll(partNum);
      request.onsuccess = () => {
        const items = request.result;
        let updated = false;
        
        for (const item of items) {
          if (item.color_id === colorId) {
            item.img_url = newUrl;
            store.put(item);
            updated = true;
          }
        }
        
        if (updated) {
          console.log(`Image mise à jour pour ${partNum} couleur ${colorId}`);
        }
        resolve(updated);
      };
      
      request.onerror = () => reject(request.error);
    } catch (error) {
      console.error('Erreur mise à jour URL:', error);
      reject(error);
    }
  });
}

// Fonction pour supprimer une pièce sans image de la DB
async function removePartFromDB(partNum, colorId) {
  return new Promise((resolve, reject) => {
    try {
      const transaction = db.db.transaction(['inventory_parts'], 'readwrite');
      const store = transaction.objectStore('inventory_parts');
      const index = store.index('part_num');
      
      const request = index.getAll(partNum);
      request.onsuccess = () => {
        const items = request.result;
        let removed = 0;
        
        for (const item of items) {
          if (item.color_id === colorId) {
            store.delete(item.id);
            removed++;
          }
        }
        
        if (removed > 0) {
          console.log(`${removed} entrée(s) supprimée(s) pour ${partNum} couleur ${colorId}`);
        }
        resolve(removed);
      };
      
      request.onerror = () => reject(request.error);
    } catch (error) {
      console.error('Erreur suppression pièce:', error);
      reject(error);
    }
  });
}

// Fonction pour transférer une pièce de l'inventaire vers un set (CORRIGÉE)
async function transferToSetOptimized(partNum, colorId, setNumber, delta, rowIndex) {
  try {
    console.log(`Transfert: ${partNum}, couleur ${colorId}, set ${setNumber}, delta ${delta}`);
    
    // Trouver l'item dans l'inventaire unifié par color_id
    const inventoryItem = unifiedDataManager.currentData.inventory.find(
      item => item.part_num === partNum && item.color_id == colorId
    );
    
    if (!inventoryItem) {
      showToast('Pièce non trouvée dans l\'inventaire', 'error');
      return;
    }
    
    // Trouver le set et la pièce dans le set
    const set = unifiedDataManager.currentData.sets.find(s => s.number === setNumber);
    if (!set) {
      showToast('Set non trouvé', 'error');
      return;
    }
    
    const setPart = set.parts.find(p => p.part_num === partNum && p.color_id == colorId);
    if (!setPart) {
      showToast('Pièce non trouvée dans le set', 'error');
      return;
    }
    
    const currentInventoryQty = inventoryItem.quantity;
    const currentSetQty = setPart.quantity_owned || 0;
    
    // Vérifications selon le type de transfert
    if (delta > 0) {
      // Transfert INVENTAIRE → SET : vérifier qu'on a assez en inventaire
      if (currentInventoryQty <= 0) {
        showToast('Quantité insuffisante dans l\'inventaire', 'error');
        return;
      }
      // Vérifier qu'on ne dépasse pas la quantité nécessaire dans le set
      if (currentSetQty >= setPart.quantity) {
        showToast('Set déjà complet pour cette pièce', 'info');
        return;
      }
    } else {
      // Transfert SET → INVENTAIRE : vérifier qu'on peut retirer du set
      if (currentSetQty <= 0) {
        showToast('Aucune pièce à retirer du set', 'error');
        return;
      }
    }
    
    // Calculer les nouvelles quantités
    const newInventoryQty = Math.max(0, currentInventoryQty - delta);
    const newSetQty = Math.max(0, Math.min(currentSetQty + delta, setPart.quantity));
    
    console.log(`Avant: inventaire=${currentInventoryQty}, set=${currentSetQty}`);
    console.log(`Après: inventaire=${newInventoryQty}, set=${newSetQty}`);
    
    // 1. Modifier la quantité dans l'inventaire unifié
    unifiedDataManager.updateInventory(
      partNum, 
      colorId, 
      inventoryItem.color_name, 
      newInventoryQty, 
      inventoryItem.category
    );
    
    // 2. Modifier la quantité dans le set (format unifié)
    setPart.quantity_owned = newSetQty;
    
    // Sauvegarder
    await unifiedDataManager.saveUnifiedData();
    
    // 3. Mettre à jour l'affichage de la quantité d'inventaire
    const qtyElement = document.getElementById(`inventory-qty-${partNum}-${colorId}`);
    if (qtyElement) {
      qtyElement.textContent = newInventoryQty;
      
      // Animation pour feedback visuel
      qtyElement.style.backgroundColor = delta > 0 ? '#ff9800' : '#2196f3';
      qtyElement.style.color = 'white';
      qtyElement.style.transition = 'all 0.3s ease';
      
      setTimeout(() => {
        qtyElement.style.backgroundColor = '';
        qtyElement.style.color = '';
      }, 500);
    }
    
    // 4. Calculer le nouveau nombre manquant
    const newMissing = setPart.quantity - newSetQty;
    
    if (delta > 0) {
      showToast(`Pièce transférée au set ${setNumber} (${newMissing} manquant(s))`, 'success');
    } else {

async function changeInventoryQuantityOptimized(partNum, colorId, delta, rowIndex) {

      item => item.part_num === partNum && item.color_id == colorId
    );

      showToast('Pièce non trouvée dans l\'inventaire', 'error');
      return;
    }
    
    const currentQty = inventoryItem.quantity;
    const newQty = Math.max(0, currentQty + delta);
    
    // Mettre à jour via le gestionnaire unifié
    unifiedDataManager.updateInventory(
      partNum, 
      colorId, 
      inventoryItem.color_name, 
      newQty, 
      inventoryItem.category
    );

// Fonction optimisée pour le transfert vers un set
// Remplacer le contenu de la fonction transferToSetOptimized existante
async function transferToSetOptimized(partNum, colorId, setNumber, delta, rowIndex) {
  try {
    if (delta > 0) {
      // Transférer DE l'inventaire VERS le set
      const success = await unifiedDataManager.transferPartToSet(partNum, colorId, setNumber, delta);
      if (success) {
        showToast(`${delta} pièce(s) transférée(s) vers le set ${setNumber}`, 'success');
      }
    } else {
      // Retirer DU set VERS l'inventaire
      const set = unifiedDataManager.currentData.sets.find(s => s.number === setNumber);
      if (set) {
        const part = set.parts.find(p => p.part_num === partNum && p.color_id === colorId);
        if (part && part.quantity_owned > 0) {
          part.quantity_owned = Math.max(0, part.quantity_owned + delta);
          
          const currentInventoryQty = unifiedDataManager.getInventoryQuantity(partNum, colorId);
          const inventoryItem = unifiedDataManager.currentData.inventory.find(
            item => item.part_num === partNum && item.color_id === colorId
          );
          
          if (inventoryItem) {
            unifiedDataManager.updateInventory(
              partNum, 
              colorId, 
              inventoryItem.color_name, 
              currentInventoryQty - delta,
              inventoryItem.category
            );
          }
          
          await unifiedDataManager.saveUnifiedData();
          showToast(`${-delta} pièce(s) retirée(s) du set ${setNumber}`, 'success');
        } else {
          showToast('Aucune pièce à retirer du set', 'error');
          return;
        }
      }
    }
    
    // Utiliser le nom de fonction existant
    updateMissingInfoDisplay(partNum, colorId, setNumber, rowIndex);
    
  } catch (error) {
    console.error('Erreur transfert:', error);
    showToast('Erreur lors du transfert: ' + error.message, 'error');
  }
}

// Fonction pour mettre à jour l'affichage des informations de manquant
// Remplacer le contenu de la fonction updateMissingInfoDisplay existante
function updateMissingInfoDisplay(partNum, colorId, setNumber, rowIndex) {
  const availableQty = unifiedDataManager.getInventoryQuantity(partNum, colorId);
  
  // Mettre à jour la quantité d'inventaire affichée
  const qtyElement = document.getElementById(`inventory-qty-${partNum}-${colorId}`);
  if (qtyElement) {
    qtyElement.textContent = availableQty;
  }
  
  // Recalculer les informations de pièces manquantes
  const missingPartsInfo = getMissingPartsInfo();
  const key = `${partNum}_${colorId}`;
  const missingInSets = missingPartsInfo[key] ? missingPartsInfo[key].sets : [];
  
  // Debug pour ce set spécifique
  const currentSetInfo = missingInSets.find(s => s.setNumber === setNumber);
  if (currentSetInfo) {
    console.log(`Debug pour ${partNum}-${colorId} dans set ${setNumber}:`);
    console.log(`- availableQty (inventaire): ${availableQty}`);
    console.log(`- currentSetInfo.owned (dans le set): ${currentSetInfo.owned}`);
    console.log(`- currentSetInfo.missing: ${currentSetInfo.missing}`);
  }
  
  // Mettre à jour la cellule "Manquant dans"
  const missingCell = document.querySelector(`#inventory-row-${rowIndex} td:nth-child(8)`);
  if (missingCell) {
    missingCell.innerHTML = missingInSets.length > 0 ? 
      missingInSets.map(set => `
        <div style="margin-bottom: 8px; padding: 5px; background: #fff3e0; border-radius: 3px; display: flex; align-items: center; gap: 8px;">
          <div id="set-img-${set.setNumber}-${rowIndex}" style="width: 30px; height: 30px; background: #f0f0f0; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 0.6em; flex-shrink: 0;">...</div>

  }
}

// Dans app.html, remplacer loadSetMiniature par cette version adaptée :
async function loadSetMiniature(setNumber, index) {
  try {
    const cacheKey = `set_${setNumber}`;
    
    // Vérifier le cache d'abord (réutiliser le cache de sets.html si disponible)
    if (window.setImageCache && window.setImageCache.has(cacheKey)) {
      const cachedUrl = window.setImageCache.get(cacheKey);
      const imgContainer = document.getElementById(`set-img-${setNumber}-${index}`);
      if (imgContainer) {
        imgContainer.innerHTML = `<img src="${cachedUrl}" alt="Set ${setNumber}" 
          style="width: 30px; height: 30px; object-fit: contain; border-radius: 3px;">`;
      }
      return;
    }

    // Construire la liste des URLs à tester (même logique que sets.html)
    const fallbackUrls = [
      `https://cdn.rebrickable.com/media/sets/${setNumber}-1.jpg`, // Format standard en priorité
      `https://cdn.rebrickable.com/media/sets/${setNumber}.jpg`, // Format sans -1
      `https://cdn.rebrickable.com/media/sets/${setNumber}/set_img.jpg`, // Format alternatif
    ];

    const imgContainer = document.getElementById(`set-img-${setNumber}-${index}`);
    if (!imgContainer) return;

    let imageLoaded = false;

    // Tester les URLs dans l'ordre
    for (let i = 0; i < fallbackUrls.length && !imageLoaded; i++) {
      const url = fallbackUrls[i];
      
      try {
        const imageExists = await testImageUrl(url);
        if (imageExists) {
          imgContainer.innerHTML = `<img src="${url}" alt="Set ${setNumber}" 
            style="width: 30px; height: 30px; object-fit: contain; border-radius: 3px;">`;
          
          // Mettre en cache si possible
          if (window.setImageCache) {
            window.setImageCache.set(cacheKey, url);
          }
          imageLoaded = true;
          break;
        }
      } catch (error) {
        console.log(`Erreur pour ${url}:`, error);
      }
    }

    // Si aucune image trouvée, essayer l'API (même logique que sets.html)
    if (!imageLoaded) {
      const apiKey = localStorage.getItem('rebrickable_api_key');
      if (apiKey) {
        try {
          const response = await fetch(`https://rebrickable.com/api/v3/lego/sets/${setNumber}/`, {
            headers: { 
              'Authorization': `key ${apiKey}`,
              'Accept': 'application/json'
            }
          });
          
          if (response.ok) {
            const setData = await response.json();
            const apiImageUrl = setData.set_img_url;
            
            if (apiImageUrl) {
              const imageExists = await testImageUrl(apiImageUrl);
              if (imageExists) {
                imgContainer.innerHTML = `<img src="${apiImageUrl}" alt="Set ${setNumber}" 
                  style="width: 30px; height: 30px; object-fit: contain; border-radius: 3px;">`;
                
                if (window.setImageCache) {
                  window.setImageCache.set(cacheKey, apiImageUrl);
                }
                imageLoaded = true;
              }
            }
          }
        } catch (error) {
          console.log(`Erreur API pour ${setNumber}:`, error);
        }
      }
    }

    if (!imageLoaded) {
      setSetImageError(setNumber, index);
    }

  } catch (error) {
    console.error('Erreur chargement image set:', error);
    setSetImageError(setNumber, index);
  }
}

// Ajouter la fonction testImageUrl si elle n'existe pas déjà dans app.html
function testImageUrl(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
    setTimeout(() => resolve(false), 5000);
  });
}

// Fonction pour transférer une pièce de l'inventaire vers un set (CORRIGÉE)
async function transferToSet(partNum, colorId, setNumber, delta = 1) {
  try {
    // Trouver l'item dans l'inventaire unifié par color_id
    const inventoryItem = unifiedDataManager.currentData.inventory.find(
      item => item.part_num === partNum && item.color_id == colorId
    );
    
    if (!inventoryItem) {
      showToast('Pièce non trouvée dans l\'inventaire', 'error');
      return;
    }
    
    const currentQty = inventoryItem.quantity;
    
    if (delta > 0 && currentQty <= 0) {
      showToast('Quantité insuffisante dans l\'inventaire', 'error');
      return;
    }
    
    // Modifier la quantité dans l'inventaire unifié
    const newQty = Math.max(0, currentQty - delta);
    unifiedDataManager.updateInventory(
      partNum, 
      colorId, 
      inventoryItem.color_name, 
      newQty, 
      inventoryItem.category
    );
    
    // Modifier la quantité dans le set (format legacy)
    const setsData = localStorage.getItem("lego_sets_data");
    if (setsData) {
      const parsedData = JSON.parse(setsData);
      if (parsedData.sets && Array.isArray(parsedData.sets)) {
        const set = parsedData.sets.find(s => s.number === setNumber);
        if (set && set.parts) {
          const part = set.parts.find(p => p.partNum === partNum && p.colorId == colorId);
          if (part) {
            const newOwned = Math.max(0, Math.min((part.quantityOwned || 0) + delta, part.quantity));
            part.quantityOwned = newOwned;
            localStorage.setItem("lego_sets_data", JSON.stringify(parsedData));
            
            if (delta > 0) {
              showToast(`Pièce transférée au set ${setNumber}`, 'success');
            } else {
              showToast(`Pièce retirée du set ${setNumber}`, 'info');
            }
          }
        }
      }
    }
    
    // Sauvegarder les données unifiées
    await unifiedDataManager.saveUnifiedData();
    
    // Recharger l'affichage
    showPersonalInventory();
    
  } catch (error) {
    console.error('Erreur transfert vers set:', error);
    showToast('Erreur lors du transfert', 'error');
  }
}
