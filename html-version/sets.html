    // ================================
    // SET MANAGER
    // ================================
    class SetManager {
      constructor(apiKey, unifiedDataManager) {
        this.apiKey = apiKey;
        this.unifiedManager = unifiedDataManager;
        this.sets = [];
        this.isReady = false;
  }
  // Nouvelle méthode pour vérifier si le manager est prêt
  async waitForReady() {
    if (this.isReady) return true;
    
    // Attendre que legoDb soit prête si elle existe
    if (legoDb) {
      try {
        await legoDb.getData('parts');
        this.isReady = true;
        return true;
      } catch (error) {
        console.warn('IndexedDB non accessible:', error);
        // Continuer sans IndexedDB
      }
    }
    
    this.isReady = true;
    return true;
  }

  // Modifier fetchSetData pour attendre d'être prêt
  async fetchSetData(setNumber) {
    // AJOUT : Attendre d'être prêt
    await this.waitForReady();
    
    // Vérifier si le set existe déjà 
    if (this.unifiedManager.currentData.sets.some(s => s.number === setNumber)) {
      throw new Error('Ce set est déjà dans votre collection');
    }

    try {
      // Essayer d'abord avec les données locales IndexedDB SI disponible
      if (legoDb) {
        let setFromLocal = await this.getSetFromIndexedDB(setNumber);
        if (setFromLocal) {
          console.log('Set trouvé dans IndexedDB');
          setFromLocal = await this.completePartsInfo(setFromLocal);
          this.sets.push(setFromLocal);
          this.saveToUnified();
          return setFromLocal;
        }
      }

      // Sinon, utiliser l'API Rebrickable
      console.log('Récupération depuis l\'API Rebrickable...');
      const setFromAPI = await this.fetchSetFromAPI(setNumber);
      return setFromAPI;
      
    } catch (error) {
      console.error('Erreur fetchSetData:', error);
      throw new Error('Erreur lors de la récupération des données du set: ' + error.message);
    }
  }


  // Charger les sets depuis le gestionnaire unifié
loadFromUnified() {
  this.sets = this.unifiedManager.currentData.sets.map(unifiedSet => ({
    number: unifiedSet.number,
    name: unifiedSet.name,
    imageUrl: unifiedSet.imageUrl || '',
    numParts: unifiedSet.parts.reduce((sum, p) => sum + p.quantity, 0),
    minifigsCount: unifiedSet.minifigsCount || 0,
    minifigs: unifiedSet.minifigs || [],     // ← restaurer
    parts: unifiedSet.parts.map(p => ({
      id: `${p.part_num}_${p.color_id}_false`,
      partNum: p.part_num,
      name: '',
      color: '',
      colorId: p.color_id,
      quantity: p.quantity,
      quantityOwned: p.quantity_owned || 0,
      imageUrl: '',
      isSpare: false,
      isMinifigPart: p.is_minifig_part || false,  // ← restaurer
      minifigNum: p.minifig_num || null             // ← restaurer
    }))
  }));
}

  // Ajouter cette méthode pour compléter les informations des pièces depuis IndexedDB
async completePartsInfo(set) {
  if (!legoDb) return set;
  
  try {
    const partsData = await legoDb.getData('parts');
    const colorsData = await legoDb.getData('colors');
    
    const partsMap = new Map(partsData.map(p => [p.part_num, p]));
    const colorsMap = new Map(colorsData.map(c => [c.id, c]));
    
    set.parts = set.parts.map(part => {
      const partInfo = partsMap.get(part.partNum);
      const colorInfo = colorsMap.get(part.colorId);
      
      return {
        ...part,
        name: partInfo ? partInfo.name : part.name || 'Pièce inconnue',
        color: colorInfo ? colorInfo.name : part.color || 'Couleur inconnue',
        imageUrl: partInfo ? partInfo.part_img_url : part.imageUrl || ''
      };
    });
    
    return set;
  } catch (error) {
    console.error('Erreur completePartsInfo:', error);
    return set;
  }
}

  // Mettre à jour la quantité possédée d'une pièce
  updatePartQuantity(setNumber, partId, delta) {
    const set = this.sets.find(s => s.number === setNumber);
    if (!set) return;

    const part = set.parts.find(p => p.id === partId);
    if (!part || part.isSpare) return;

    part.quantityOwned = Math.max(0, Math.min(part.quantity, part.quantityOwned + delta));
    
    // Sauvegarder dans le format unifié
    this.unifiedManager.updateSetPartQuantity(setNumber, part.partNum, part.colorId, part.quantityOwned);
    this.unifiedManager.scheduledSave();
  }

  getSet(setNumber) {
    return this.sets.find(s => s.number === setNumber);
  }

  removeSet(setNumber) {
  console.log(`Suppression du set ${setNumber}`);
  console.log('Sets avant suppression:', this.sets.map(s => s.number));
  
  this.sets = this.sets.filter(s => s.number !== setNumber);
  this.unifiedManager.removeSet(setNumber);
  this.unifiedManager.saveUnifiedData();
  
  console.log('Sets après suppression:', this.sets.map(s => s.number));
  }

  // Sauvegarder dans le format unifié
saveToUnified() {
  this.unifiedManager.currentData.sets = this.sets.map(set => ({
    number: set.number,
    name: set.name,
    imageUrl: set.imageUrl || '',
    minifigsCount: set.minifigsCount || 0,
    minifigs: (set.minifigs || []),          // ← persister la liste des minifigs
    parts: set.parts
      .filter(p => !p.isSpare)
      .map(p => ({
        part_num: p.partNum,
        color_id: p.colorId,
        quantity: p.quantity,
        quantity_owned: p.quantityOwned || 0,
        is_minifig_part: p.isMinifigPart || false,  // ← persister
        minifig_num: p.minifigNum || null             // ← persister
      }))
  }));
  return this.unifiedManager.saveUnifiedData();
}

async getSetFromIndexedDB(setNumber) {
  try {
    if (!legoDb || !legoDb.db) {
      console.log('IndexedDB non disponible');
      return null;
    }
    
    // Vérifier que la connexion DB est active
    if (legoDb.db.version === 0) {
      console.log('Connexion IndexedDB fermée');
      return null;
    }
    
    // Récupérer tous les inventory_parts avec gestion d'erreur
    let allInventoryParts;
    try {
      allInventoryParts = await legoDb.getData('inventory_parts');
    } catch (dbError) {
      console.log('Erreur accès inventory_parts:', dbError);
      return null;
    }
    
    const inventoryParts = allInventoryParts.filter(ip => ip.inventory_id === setNumber);
    
    if (!inventoryParts || inventoryParts.length === 0) {
      console.log(`Aucune pièce trouvée pour le set ${setNumber} dans IndexedDB`);
      return null;
    }

    // Récupérer les informations des pièces avec gestion d'erreur
    const [partsData, colorsData] = await Promise.all([
      legoDb.getData('parts').catch(() => []),
      legoDb.getData('colors').catch(() => [])
    ]);
    
    const partsMap = new Map(partsData.map(p => [p.part_num, p]));
    const colorsMap = new Map(colorsData.map(c => [c.id, c]));

    // Construire le set
    const parts = inventoryParts.map(invPart => {
      const part = partsMap.get(invPart.part_num);
      const color = colorsMap.get(invPart.color_id);
      
      return {
        id: `${invPart.part_num}_${invPart.color_id}_false`,
        partNum: invPart.part_num,
        name: part ? part.name : 'Pièce inconnue',
        color: color ? color.name : 'Couleur inconnue',
        colorId: invPart.color_id,
        quantity: 1,
        quantityOwned: 0,
        imageUrl: invPart.img_url || '',
        isSpare: false,
        isMinifigPart: false
      };
    });

    console.log(`Set ${setNumber} trouvé dans IndexedDB avec ${parts.length} pièces`);
    
    return {
      number: setNumber,
      name: `Set ${setNumber}`,
      imageUrl: parts[0]?.imageUrl || '',
      numParts: parts.length,
      minifigsCount: 0,
      parts: parts
    };

  } catch (error) {
    console.error('Erreur getSetFromIndexedDB:', error);
    return null;
  }
}

      async fetchSetFromAPI(setNumber) {
  const [setRes, partsRes, minifigsRes] = await Promise.all([
    fetch(`https://rebrickable.com/api/v3/lego/sets/${setNumber}/`, {
      headers: { Authorization: `key ${this.apiKey}` }
    }),
    fetch(`https://rebrickable.com/api/v3/lego/sets/${setNumber}/parts/?page_size=1000`, {
      headers: { Authorization: `key ${this.apiKey}` }
    }),
    fetch(`https://rebrickable.com/api/v3/lego/sets/${setNumber}/minifigs/?page_size=1000`, {
      headers: { Authorization: `key ${this.apiKey}` }
    })
  ]);

  if (!setRes.ok) throw new Error(`Set ${setNumber} non trouvé`);

  const setData     = await setRes.json();
  const partsData   = partsRes.ok   ? await partsRes.json()   : { results: [] };
  const minifigsData = minifigsRes.ok ? await minifigsRes.json() : { results: [] };

  // ── Récupérer pièces ET infos de chaque minifig ──────────────
  // minifigPartsResults déclaré ICI pour être accessible partout dans la méthode
  let minifigPartsResults = [];
  const minifigsEnriched  = []; // minifigs avec nom + image

  if (minifigsData.results.length > 0) {
    const promises = minifigsData.results.map(async (minifig, index) => {
      await this.delay(index * 200);
      try {
        // Une seule requête suffit : /minifigs/{fig_num}/parts/
        // Pour le nom et l'image on appelle /minifigs/{fig_num}/
        const [partsRes2, infoRes] = await Promise.all([
          fetch(
            `https://rebrickable.com/api/v3/lego/minifigs/${minifig.set_num}/parts/?page_size=1000`,
            { headers: { Authorization: `key ${this.apiKey}` } }
          ),
          fetch(
            `https://rebrickable.com/api/v3/lego/minifigs/${minifig.set_num}/`,
            { headers: { Authorization: `key ${this.apiKey}` } }
          )
        ]);

        const figParts = partsRes2.ok ? (await partsRes2.json()).results || [] : [];
        const figInfo  = infoRes.ok   ? await infoRes.json() : null;

        minifigsEnriched.push({
          figNum:   minifig.set_num,
          name:     figInfo ? figInfo.name : minifig.set_num,
          imageUrl: figInfo ? (figInfo.set_img_url || '') : '',
          quantity: minifig.quantity
        });

        return figParts;
      } catch (err) {
        console.error(`Erreur minifig ${minifig.set_num}:`, err);
        minifigsEnriched.push({
          figNum:   minifig.set_num,
          name:     minifig.set_num,
          imageUrl: '',
          quantity: minifig.quantity
        });
        return [];
      }
    });

    minifigPartsResults = await Promise.all(promises);
  }

  // ── Construire la Map part_key → figNum pour identifier l'appartenance ──
  // IMPORTANT : utiliser partsData.results uniquement (pas de ...minifigParts)
  // L'API /sets/{num}/parts/ retourne DÉJÀ toutes les pièces (normales + minifig)
  // avec is_spare correctement renseigné
  const minifigPartsMap = new Map(); // "partNum_colorId" → figNum
  minifigsEnriched.forEach((fig, idx) => {
    const figParts = minifigPartsResults[idx] || [];
    figParts.forEach(p => {
      minifigPartsMap.set(`${p.part.part_num}_${p.color.id}`, fig.figNum);
    });
  });

  // ── Construire le set ─────────────────────────────────────────
  const legoSet = {
    number:        setData.set_num,
    name:          setData.name,
    imageUrl:      setData.set_img_url || '',
    numParts:      setData.num_parts,
    minifigsCount: minifigsData.results.length,
    minifigs:      minifigsEnriched, // ← nom et image corrects

    // partsData.results contient TOUTES les pièces (normales + minifig + spare)
    // On ne concatène PAS minifigParts pour éviter les doublons
    parts: partsData.results.map(p => {
      const key = `${p.part.part_num}_${p.color.id}`;
      return {
        id:           `${p.part.part_num}_${p.color.id}_${p.is_spare}`,
        partNum:      p.part.part_num,
        name:         p.part.name,
        color:        p.color.name,
        colorId:      p.color.id,
        quantity:     p.quantity,
        quantityOwned: 0,
        imageUrl:     p.part.part_img_url || '',
        isSpare:      p.is_spare,
        isMinifigPart: minifigPartsMap.has(key) && !p.is_spare, // spare ≠ minifig
        minifigNum:   minifigPartsMap.get(key) || null
      };
    })
  };

  this.sets.push(legoSet);
  this.saveToUnified();
  return legoSet;
}

      delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      getSet(setNumber) {
        return this.sets.find(s => s.number === setNumber);
      }

       getCompletionStats() {
        const totalSets = this.sets.length;
        const completedSets = this.sets.filter(set =>
          set.parts.filter(p => !p.isSpare).every(part => part.quantityOwned >= part.quantity)
        ).length;

        return {
          totalSets,
          completedSets,
          completionPercentage: totalSets > 0 ? (completedSets / totalSets) * 100 : 0
        };
      }

      getMissingPartsGroupedByPart() {
        const partsMap = new Map();

        this.sets.forEach(set => {
          set.parts
            .filter(p => !p.isSpare && p.quantityOwned < p.quantity)
            .forEach(p => {
              const key = `${p.partNum}_${p.colorId}`;
              if (!partsMap.has(key)) {
                partsMap.set(key, {
                  id: p.id,
                  partNum: p.partNum,
                  name: p.name,
                  color: p.color,
                  colorId: p.colorId,
                  imageUrl: p.imageUrl,
                  totalMissing: 0,
                  sets: []
                });
              }
              const partData = partsMap.get(key);
              const missing = p.quantity - p.quantityOwned;
              partData.totalMissing += missing;
              partData.sets.push({
                number: set.number,
                name: set.name,
                imageUrl: set.imageUrl,
                missing: missing
              });
            });
        });

        return Array.from(partsMap.values()).sort((a, b) => b.totalMissing - a.totalMissing);
      }

async checkInventoryForPart(partNum, colorId) {
  try {
    // Utiliser UNIQUEMENT le gestionnaire unifié — source de vérité unique
    if (window.unifiedDataManager) {
      return window.unifiedDataManager.getInventoryQuantity(partNum, parseInt(colorId));
    }
    // Fallback si unifiedDataManager pas encore chargé
    const saved = localStorage.getItem('lego_unified_data_v2');
    if (!saved) return 0;
    const data = JSON.parse(saved);
    const item = (data.inventory || []).find(
      i => i.part_num === partNum && i.color_id === parseInt(colorId)
    );
    return item ? item.quantity : 0;
  } catch (error) {
    console.error('Erreur vérification inventaire:', error);
    return 0;
  }
}

async function initApp() {
  try {
    showToast('Initialisation de l\'application...', 'info');
    
    // Vérifier la clé API
    const apiKey = localStorage.getItem('rebrickable_api_key');
    if (!apiKey) {
      showToast('Veuillez configurer votre clé API Rebrickable dans le menu principal.', 'warning');
      setTimeout(() => {
        window.location.href = 'menu.html';
      }, 3000);
      return;
    }

    // Initialiser IndexedDB
    try {
      legoDb = new LegoDatabase();
      await legoDb.init();
      await legoDb.verifyAndRepairStores();
      
      // CORRECTION : Vérifier que les données sont accessibles
      try {
        await legoDb.getData('parts');
        console.log('IndexedDB complètement opérationnelle');
      } 
      catch (testError) {  // CORRIGER ICI : c'était 'error' avant
        console.warn('IndexedDB non accessible, utilisation API uniquement:', testError);
        legoDb = null; // Forcer l'utilisation de l'API
      }
    } catch (error) {
      console.warn('IndexedDB non disponible, utilisation API uniquement:', error);
      legoDb = null; // AJOUTER cette ligne
    }

    // Initialiser le gestionnaire unifié
    unifiedDataManager = new UnifiedDataManager();
    await unifiedDataManager.loadUnifiedData();

    // Initialiser les managers
    setManager = new SetManager(apiKey, unifiedDataManager);
    
    // Charger les sets depuis le format unifié
    setManager.loadFromUnified(); // Cette méthode existe maintenant

    showHomeView();
    showToast('Application initialisée avec succès', 'success');
    
  } catch (error) {
    console.error('Erreur lors de l\'initialisation:', error);
    showToast('Erreur lors de l\'initialisation: ' + error.message, 'error');
  }
}

      });
      
      // Filtres
      document.getElementById('hide-completed').addEventListener('change', () => {
        if (currentSetNumber) renderSetParts(currentSetNumber);
      });
      
      // Import/Export
      document.getElementById('import-file').addEventListener('change', handleFileImport);
      document.querySelectorAll('[data-format]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          handleExport(e.target.dataset.format);
        });
      });
    }

    function showSetDetailView(setNumber) {

// Fonction optimisée pour les images de sets avec cache et priorité au lien direct
async function loadSetImageWithAPI(imgElement, setNumber, originalUrl, apiKey, isSetHeader = false) {
  const cacheKey = `set_${setNumber}`;
  
  // Vérifier le cache d'abord
  if (setImageCache.has(cacheKey)) {
    const cachedUrl = setImageCache.get(cacheKey);
    imgElement.src = cachedUrl;
    imgElement.style.opacity = '1';
    console.log(`✓ Image chargée depuis le cache: ${cachedUrl}`);
    return;
  }

  // Construire la liste des URLs à tester
  const fallbackUrls = [
    `https://cdn.rebrickable.com/media/sets/${setNumber}-1.jpg`, // Format standard en priorité
    originalUrl, // URL de l'API si disponible
    `https://cdn.rebrickable.com/media/sets/${setNumber}.jpg`, // Format sans -1
    `https://cdn.rebrickable.com/media/sets/${setNumber}/set_img.jpg`, // Format alternatif
  ].filter(url => url && url.trim() && !url.includes('placeholder'));

  console.log(`Tests d'images pour le set ${setNumber}:`, fallbackUrls);

  let imageLoaded = false;

  for (let i = 0; i < fallbackUrls.length && !imageLoaded; i++) {
    const url = fallbackUrls[i];
    console.log(`Test ${i + 1}/${fallbackUrls.length}: ${url}`);
    
    try {
      const imageExists = await testImageUrl(url);
      if (imageExists) {
        imgElement.src = url;
        imgElement.style.opacity = '1';
        console.log(`✓ Image chargée: ${url}`);
        
        // Mettre en cache
        setImageCache.set(cacheKey, url);
        imageLoaded = true;
        break;
      } else {
        console.log(`✗ Image inaccessible: ${url}`);
      }
    } catch (error) {
      console.log(`✗ Erreur pour ${url}:`, error);
    }
  }

  // Si aucune image trouvée, essayer l'API
  if (!imageLoaded && (!originalUrl || originalUrl.includes('placeholder'))) {
    try {
      console.log(`Tentative API pour le set ${setNumber}...`);
      const response = await fetch(`https://rebrickable.com/api/v3/lego/sets/${setNumber}/`, {
        headers: { 
          'Authorization': `key ${apiKey}`,
          'Accept': 'application/json'
        }
      });
      
      if (response.ok) {
        const setData = await response.json();
        const apiImageUrl = setData.set_img_url;
        console.log(`URL d'image récupérée via API: ${apiImageUrl}`);
        
        if (apiImageUrl) {
          const imageExists = await testImageUrl(apiImageUrl);
          if (imageExists) {
            imgElement.src = apiImageUrl;
            imgElement.style.opacity = '1';
            setImageCache.set(cacheKey, apiImageUrl);
            imageLoaded = true;
            console.log(`✓ Image chargée via API: ${apiImageUrl}`);
          }
        }
      }
    } catch (error) {
      console.log(`Erreur API pour ${setNumber}:`, error);
    }
  }

  if (!imageLoaded) {
    console.error(`Aucune image trouvée pour le set ${setNumber}`);
    showImageDebugInfo(imgElement, setNumber, fallbackUrls, isSetHeader);
  }
}

// Fonction pour tester si une image existe (inchangée)
function testImageUrl(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
    setTimeout(() => resolve(false), 5000);
  });
}

// AJOUTER cette fonction helper avant renderSetParts() :
function buildPartRow(part, setNumber) {
  const isCompleted = part.quantityOwned >= part.quantity;
  const item = document.createElement('div');
  item.className = `parts-table-row ${isCompleted ? 'completed' : ''}`;
  item.innerHTML = `
    <div class="part-col-image">
      <div id="part-img-${part.id}" style="width:60px;height:60px;display:flex;
           align-items:center;justify-content:center;background:#f0f0f0;
           border:1px solid #ddd;border-radius:3px;">
        Chargement...
      </div>
    </div>
    <div class="part-col-name">
      <strong>${part.name || 'Chargement...'}</strong>
      ${part.isMinifigPart ? '<span class="badge bg-warning ms-1">Minifig</span>' : ''}
    </div>
    <div class="part-col-number">#${part.partNum}</div>
    <div class="part-col-color">${part.color || 'Chargement...'}</div>
    <div class="part-col-controls">
      <button class="btn btn-outline-secondary btn-sm" data-action="decrement" 
              ${part.quantityOwned <= 0 ? 'disabled' : ''}>
        <i class="bi bi-dash"></i>
      </button>
      <button class="btn btn-outline-secondary btn-sm" data-action="increment" 
              ${part.quantityOwned >= part.quantity ? 'disabled' : ''}>
        <i class="bi bi-plus"></i>
      </button>
    </div>
    <div class="part-col-counts">
      <span class="quantity-display">${part.quantityOwned}/${part.quantity}</span>
    </div>
    <div class="part-col-all">
      <input type="checkbox" class="form-check-input all-checkbox" 
             data-part-id="${part.id}" 
             ${part.quantityOwned >= part.quantity ? 'checked' : ''}>
    </div>
  `;
  
  // Charger l'image
  const partCacheKey = `${part.partNum}_${part.colorId}`;
  if (!loadedParts.has(partCacheKey)) {
    loadedParts.add(partCacheKey);
    loadPartImageOptimized(part.id, part.partNum, part.colorId);
  } else {
    const cachedUrl = partImageCache.get(partCacheKey);
    if (cachedUrl) {
      const imgContainer = document.getElementById(`part-img-${part.id}`);
      if (imgContainer) {
        imgContainer.innerHTML = `<img src="${cachedUrl}" alt="${part.name}" 
          style="width:60px;height:60px;object-fit:contain;">`;
      }
    }
  }
  
  // Boutons +/-
  item.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const delta = btn.dataset.action === 'increment' ? 1 : -1;
      setManager.updatePartQuantity(setNumber, part.id, delta);
      renderSetParts(setNumber); // re-render
    });
  });
  
  // Checkbox "toutes"
  item.querySelector('.all-checkbox')?.addEventListener('change', async (e) => {
    const newQty = e.target.checked ? part.quantity : 0;
    setManager.updateSetPartQuantity_direct(setNumber, part.id, newQty);
    renderSetParts(setNumber);
  });
  
  return item;
}

// Rendu de la liste des pièces d'un set avec cache optimisé
async function renderSetParts(setNumber) {

  loadedParts.clear();
  
  const container = document.getElementById('parts-list');
  const hideCompleted = document.getElementById('hide-completed').checked;
  
  await setManager.completePartsInfo(set);
  
  const normalParts = set.parts.filter(p => !p.isSpare);
  const spareParts  = set.parts.filter(p => p.isSpare);
  
  // Séparer pièces normales (non-minifig) et pièces de minifigs
  const regularParts = normalParts.filter(p => !p.isMinifigPart);
  const minifigParts = normalParts.filter(p => p.isMinifigPart);
  
  container.innerHTML = `
    <div class="parts-table-header">

  // ── 1. Pièces normales ──────────────────────────────────────────

    const minifigGroups = new Map(); // figNum → { info, parts[] }

        minifigGroups.set(key, { info: minifigInfo || null, parts: [] });
      }
      minifigGroups.get(key).parts.push(part);

    // Afficher chaque groupe

      groupHeader.style.cssText = `
        display: flex; align-items: center; gap: 12px;
        padding: 8px 12px; background: #fff8e1;
        border-left: 4px solid #ffc107; margin: 8px 0 4px;

               border-radius:4px;display:flex;align-items:center;justify-content:center;">
            <div class="spinner-border spinner-border-sm"></div>
          </div>
          <div>
            <strong>${group.info.name || figNum}</strong>
            <span class="badge bg-warning text-dark ms-2">#${figNum}</span>
            ${group.info.quantity > 1 
              ? `<span class="badge bg-secondary ms-1">×${group.info.quantity}</span>` 
              : ''}
            <div style="font-size:0.8em;color:#666;">${group.parts.length} pièce(s)</div>
          </div>
        `;
        
        // Charger l'image de la minifig
        if (group.info.imageUrl) {
          setTimeout(() => {

            if (imgContainer) {
              const img = new Image();
              img.onload = () => {
                imgContainer.innerHTML = `<img src="${group.info.imageUrl}"

              };
              img.src = group.info.imageUrl;
            }
          }, 50);
        }
      } else {
        groupHeader.innerHTML = `
          <i class="bi bi-person-fill" style="font-size:1.5rem;color:#ffc107;"></i>
          <strong>Minifigurine</strong>
          <span style="font-size:0.8em;color:#666;">${group.parts.length} pièce(s)</span>
        `;
      }
      
      container.appendChild(groupHeader);

  // ── 3. Pièces de rechange ───────────────────────────────────────
if (spareParts.length > 0) {

// Fonction optimisée pour charger les images de pièces
async function loadPartImageOptimized(partId, partNum, colorId) {
  const cacheKey = `${partNum}_${colorId}`;
  
  // Vérifier le cache d'abord
  if (partImageCache.has(cacheKey)) {
    const cachedUrl = partImageCache.get(cacheKey);
    const imgContainer = document.getElementById(`part-img-${partId}`);
    if (imgContainer) {
      imgContainer.innerHTML = `<img src="${cachedUrl}" alt="Pièce ${partNum}" style="width: 60px; height: 60px; object-fit: contain;">`;
    }
    return;
  }

  let imageUrl = '';
  
  // Essayer IndexedDB d'abord
  if (legoDb) {
    try {
      const inventoryParts = await legoDb.getDataByIndex('inventory_parts', 'part_num', partNum);
      const matchingPart = inventoryParts.find(ip => ip.color_id === colorId);
      if (matchingPart && matchingPart.img_url) {
        imageUrl = matchingPart.img_url;
      }
    } catch (error) {
      console.warn('Erreur récupération image depuis IndexedDB:', error);
    }
  }
  
  // Fallback vers l'URL générique
  if (!imageUrl) {
    imageUrl = `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`;
  }
  
  // Tester et afficher l'image
  const img = new Image();
  img.onload = () => {
    const imgContainer = document.getElementById(`part-img-${partId}`);
    if (imgContainer) {
      imgContainer.innerHTML = `<img src="${imageUrl}" alt="Pièce ${partNum}" style="width: 60px; height: 60px; object-fit: contain;">`;
      // Mettre en cache
      partImageCache.set(cacheKey, imageUrl);
    }
  };
  img.onerror = () => {
    const fallbackUrl = `https://cdn.rebrickable.com/media/parts/elements/${partNum}.jpg`;
    const fallbackImg = new Image();
    fallbackImg.onload = () => {
      const imgContainer = document.getElementById(`part-img-${partId}`);
      if (imgContainer) {
        imgContainer.innerHTML = `<img src="${fallbackUrl}" alt="Pièce ${partNum}" style="width: 60px; height: 60px; object-fit: contain;">`;
        partImageCache.set(cacheKey, fallbackUrl);
      }
    };
    fallbackImg.onerror = () => {
      const imgContainer = document.getElementById(`part-img-${partId}`);
      if (imgContainer) {
        imgContainer.innerHTML = `<div style="width: 60px; height: 60px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 0.7em; color: #666;">📦</div>`;
      }
    };

   // Fonction pour récupérer la quantité disponible depuis l'inventaire en vrac
async function getAvailableQuantityFromBulk(partNum, colorId) {
  try {
    if (unifiedDataManager) {
      const item = unifiedDataManager.currentData.inventory.find(
        item => item.part_num === partNum && item.color_id === colorId
      );
      return item ? item.quantity : 0;
    }
    return 0;
  } catch (error) {
    console.error('Erreur lecture inventaire:', error);
    return 0;
  }
}

// Fonction corrigée pour les transferts depuis les pièces manquantes
async function transferPartToSetFixed(partNum, colorId, setNumber, quantity) {
  try {
    if (quantity > 0) {
      // Transférer DE l'inventaire VERS le set
      const success = await unifiedDataManager.transferPartToSet(partNum, colorId, setNumber, quantity);
      if (success) {
        // Mettre à jour aussi dans setManager local
        const set = setManager.getSet(setNumber);
        if (set) {
          const part = set.parts.find(p => p.partNum === partNum && p.colorId === colorId);
          if (part) {
            part.quantityOwned = Math.min(part.quantity, part.quantityOwned + quantity);
          }
        }
        showToast(`${quantity} pièce(s) transférée(s) vers le set ${setNumber}`, 'success');
      }
    } else {
      // Retirer DU set VERS l'inventaire
      const set = setManager.getSet(setNumber);
      if (set) {
        const part = set.parts.find(p => p.partNum === partNum && p.colorId === colorId);
        if (part && part.quantityOwned > 0) {
          part.quantityOwned = Math.max(0, part.quantityOwned + quantity);
          
          const currentInventoryQty = unifiedDataManager.getInventoryQuantity(partNum, colorId);
          unifiedDataManager.updateInventory(partNum, colorId, part.color || 'Couleur inconnue', currentInventoryQty - quantity, 'Unknown');
          unifiedDataManager.updateSetPartQuantity(setNumber, partNum, colorId, part.quantityOwned);
          
          await unifiedDataManager.saveUnifiedData();
          showToast(`${-quantity} pièce(s) retirée(s) du set ${setNumber}`, 'success');
        }
      }
    }   
  } catch (error) {
    console.error('Erreur transfert:', error);
    showToast('Erreur lors du transfert: ' + error.message, 'error');
  }
  updateMissingPartsDisplay(partNum, colorId, setNumber);
}

   function updateMissingPartsDisplay(partNum, colorId, setNumber) {
  // Mettre à jour la quantité disponible dans l'inventaire
  const availableQty = unifiedDataManager.getInventoryQuantity(partNum, colorId);
  const availableElement = document.getElementById(`available-qty-${partNum}-${colorId}`);
  if (availableElement) {
    availableElement.textContent = availableQty;
  }
  
  // Mettre à jour la quantité manquante pour ce set spécifique
  const set = setManager.getSet(setNumber);
  if (set) {
    const part = set.parts.find(p => p.partNum === partNum && p.colorId === colorId);
    if (part) {
      const missingQty = Math.max(0, part.quantity - part.quantityOwned);
      const missingElement = document.getElementById(`missing-qty-${partNum}-${colorId}-${setNumber}`);
      
      if (missingQty === 0) {
        // Supprimer cette ligne du tableau si plus de pièce manquante
        const row = missingElement?.closest('tr');
        if (row) {
          // Vérifier si c'était la dernière ligne pour cette pièce
          const allRowsForPart = document.querySelectorAll(`[id^="missing-qty-${partNum}-${colorId}-"]`);
          
          if (allRowsForPart.length === 1) {
            // C'était la dernière ligne, supprimer complètement cette pièce
            // Trouver toutes les lignes avec rowspan pour cette pièce
            const partRows = Array.from(document.querySelectorAll(`tr`)).filter(r => 
              r.innerHTML.includes(`missing-qty-${partNum}-${colorId}`)
            );
            partRows.forEach(r => r.remove());
          } else {
            // Il reste d'autres sets avec cette pièce manquante, supprimer seulement cette ligne
            row.remove();
            
            // Si on supprime la première ligne (avec les rowspan), il faut reporter les rowspan
            const firstRowForPart = document.querySelector(`[id="missing-part-img-${partNum}-${colorId}"]`)?.closest('tr');
            if (!firstRowForPart) {
              const nextRow = document.querySelector(`[id^="missing-qty-${partNum}-${colorId}-"]`)?.closest('tr');
              if (nextRow) {
                // Récupérer le nombre de lignes restantes pour cette pièce
                const remainingRows = document.querySelectorAll(`[id^="missing-qty-${partNum}-${colorId}-"]`).length;
                
                // Ajouter les cellules avec rowspan à la nouvelle première ligne
                const part = setManager.getMissingPartsGroupedByPart().find(p => 
                  p.partNum === partNum && p.colorId === colorId
                );
                
                if (part) {
                  nextRow.insertAdjacentHTML('afterbegin', `
                    <td rowspan="${remainingRows}">
                      <div id="missing-part-img-${partNum}-${colorId}" style="width: 40px; height: 40px;">
                        <img src="${part.imageUrl}" style="width: 40px; height: 40px; object-fit: contain;">
                      </div>
                    </td>
                    <td rowspan="${remainingRows}">
                      <strong>${part.name}</strong><br><small>#${part.partNum}</small>
                    </td>
                    <td rowspan="${remainingRows}">${part.color}</td>
                    <td rowspan="${remainingRows}">
                      <span id="available-qty-${partNum}-${colorId}">${availableQty}</span>
                    </td>
                  `);
                }
              }
            }
          }
          
          // Vérifier s'il ne reste plus aucune pièce manquante
          const remainingMissingParts = document.querySelectorAll('[id^="missing-qty-"]');
          if (remainingMissingParts.length === 0) {
            // Recharger complètement avec le message de félicitations
            renderMissingParts();
          }
        }
      } else {
        // Mettre à jour seulement le nombre
        if (missingElement) {
          missingElement.textContent = missingQty;
        }
      }
      
      // Mettre à jour l'état des boutons
      const plusBtn = document.querySelector(`button[onclick*="transferPartToSetFixed('${partNum}', ${colorId}, '${setNumber}', 1)"]`);
      const minusBtn = document.querySelector(`button[onclick*="transferPartToSetFixed('${partNum}', ${colorId}, '${setNumber}', -1)"]`);
      
      if (plusBtn) {
        plusBtn.disabled = availableQty <= 0;
      }
      if (minusBtn) {
        minusBtn.disabled = missingQty <= 0;
      }
    }
  }
}

           set.name.toLowerCase().includes(query.toLowerCase()) ||
           set.number.includes(query)

   function handleExport(format) {
     try {
       let content, filename, mimeType;
       
       switch (format) {
         case 'json':
           content = JSON.stringify({ sets: setManager.sets }, null, 2);
           filename = 'lego_sets_export.json';
           mimeType = 'application/json';
           break;
           
         case 'csv':
           const missingParts = setManager.getMissingPartsGroupedByPart();
           const csvHeaders = 'Part Number,Part Name,Color,Total Missing\n';
           const csvRows = missingParts.map(p => 
             `"${p.partNum}","${p.name}","${p.color}",${p.totalMissing}`
           ).join('\n');
           content = csvHeaders + csvRows;
           filename = 'missing_parts.csv';
           mimeType = 'text/csv';
           break;
           
         case 'xml':
           content = generateXML(setManager.sets);
           filename = 'lego_sets_export.xml';
           mimeType = 'application/xml';
           break;
       }
       
       const blob = new Blob([content], { type: mimeType });
       const url = URL.createObjectURL(blob);
       const a = document.createElement('a');
       a.href = url;
       a.download = filename;
       a.click();
       URL.revokeObjectURL(url);
       
       showToast(`Export ${format.toUpperCase()} terminé`, 'success');
     } catch (error) {
       showToast('Erreur lors de l\'export: ' + error.message, 'error');
     }
   }

   function generateXML(sets) {
     let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<sets>\n';
     
     sets.forEach(set => {
       xml += `  <set number="${set.number}" name="${escapeXml(set.name)}">\n`;
       set.parts.forEach(part => {
         xml += `    <part num="${part.partNum}" name="${escapeXml(part.name)}" color="${escapeXml(part.color)}" needed="${part.quantity}" owned="${part.quantityOwned}" />\n`;
       });
       xml += '  </set>\n';
     });
     
     xml += '</sets>';
     return xml;
   }

   function escapeXml(text) {
     return text.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
   }

   // ================================
   // FONCTIONS UTILITAIRES
   // ================================
   function toggleDarkMode() {
     isDarkMode = !isDarkMode;
     document.body.classList.toggle('dark-mode', isDarkMode);
     localStorage.setItem('darkMode', isDarkMode);
     
     const icon = document.getElementById('toggle-darkmode');
     icon.innerHTML = isDarkMode ? '<i class="bi bi-sun-fill"></i>' : '<i class="bi bi-moon-fill"></i>';
   }

   // ================================
   // SYSTÈME DE NOTIFICATIONS
   // ================================
   function showToast(message, type = 'info') {
     const toastContainer = document.querySelector('.toast-container');
     
     const toast = document.createElement('div');
     toast.className = `toast align-items-center text-white bg-${type === 'error' ? 'danger' : type} border-0`;
     toast.setAttribute('role', 'alert');
     toast.innerHTML = `
       <div class="d-flex">
         <div class="toast-body">${message}</div>
         <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
       </div>
     `;
     
     toastContainer.appendChild(toast);
     
     const bsToast = new bootstrap.Toast(toast);
     bsToast.show();
     
     toast.addEventListener('hidden.bs.toast', () => {
       toast.remove();
     });
   }

   // ================================
   // NAVIGATION
   // ================================
   function goToMenu() {
  if (unifiedDataManager) {
    unifiedDataManager.saveUnifiedData();
  }
  window.location.href = 'menu.html';
}

   // Exposer les fonctions nécessaires globalement
   window.goToMenu = goToMenu;

   // Expose a global async function for transferring parts
   window.transferPartToSetFixed = transferPartToSetFixed;

   </script>
