<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Bricks Manager — Mes Sets</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a href="menu.html" class="btn btn-back">← Menu</a>
      <h1 id="page-title">Mes Sets</h1>
      <div class="header-actions" id="header-actions"></div>
    </header>

    <!-- Vue liste des sets -->
    <div id="view-sets">
      <!-- Recherche + ajout -->
      <div class="card search-card">
        <div class="search-row">
          <div class="search-wrapper">
            <input type="text" id="set-search-input" placeholder="Numéro ou nom du set…"
                   autocomplete="off" oninput="onSetSearchInput(this.value)"/>
            <div id="set-suggestions" class="suggestions-dropdown" style="display:none"></div>
          </div>
          <button class="btn btn-primary" onclick="addSetFromInput()">Ajouter</button>
        </div>
        <p id="api-status-msg" class="api-status" style="display:none"></p>
      </div>

      <!-- Stats globales -->
      <div class="card stats-card" id="global-stats">
        <div class="stat-chip"><span id="stat-total">0</span> sets</div>
        <div class="stat-chip success"><span id="stat-complete">0</span> complets</div>
        <div class="stat-chip warning"><span id="stat-incomplete">0</span> incomplets</div>
      </div>

      <!-- Grille des sets -->
      <div id="sets-grid" class="sets-grid"></div>

      <!-- Vue pièces manquantes -->
      <div id="missing-parts-section" style="display:none">
        <h2>Pièces manquantes</h2>
        <div id="missing-parts-list"></div>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="toggleMissingParts()">Voir pièces manquantes</button>
        <button class="btn btn-secondary" onclick="showImportExport()">Import / Export</button>
      </div>
    </div>

    <!-- Vue détail d'un set -->
    <div id="view-set-detail" style="display:none">
      <div class="card">
        <div class="set-detail-header">
          <img id="detail-img" src="" alt="" class="set-detail-img" onerror="this.style.display='none'"/>
          <div>
            <h2 id="detail-name"></h2>
            <p id="detail-meta" class="text-secondary"></p>
            <div class="progress-bar-container">
              <div id="detail-progress" class="progress-bar"></div>
            </div>
            <p id="detail-progress-label" class="progress-label"></p>
          </div>
        </div>
        <div class="filter-row">
          <label><input type="checkbox" id="hide-completed" onchange="renderPartsList()"/> Masquer complétées</label>
          <button class="btn btn-secondary btn-sm" onclick="completeAllParts()">Tout posséder</button>
          <button class="btn btn-warning btn-sm" onclick="resetAllParts()">Tout remettre à zéro</button>
        </div>
        <div id="parts-table-container">
          <table class="parts-table" id="parts-table">
            <thead>
              <tr>
                <th>Image</th><th>Pièce</th><th>Couleur</th>
                <th>Qté néc.</th><th>Qté possédée</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="parts-tbody"></tbody>
          </table>
        </div>
        <div id="spares-container" style="display:none">
          <h3>Pièces de rechange</h3>
          <table class="parts-table">
            <tbody id="spares-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-back" onclick="showSetsView()">← Retour</button>
        <button class="btn btn-danger" onclick="deleteCurrentSet()">Supprimer ce set</button>
      </div>
    </div>

    <!-- Modal Import/Export -->
    <div id="modal-ie" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
      <div class="modal-content">
        <h2>Import / Export</h2>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="exportJSON()">Exporter JSON</button>
          <button class="btn btn-secondary" onclick="exportCSV()">Exporter CSV (BrickLink)</button>
        </div>
        <hr/>
        <label class="btn btn-secondary" style="cursor:pointer">
          Importer JSON
          <input type="file" accept=".json" style="display:none" onchange="importJSON(this)"/>
        </label>
        <div id="import-preview" style="display:none"></div>
        <button class="btn btn-back" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>

  <script src="lego-db.js"></script>
  <script src="unified-data-manager.js"></script>
  <script>
  // ── Configuration API Rebrickable ─────────────────────────────────────────
  const REBRICKABLE_API = "https://rebrickable.com/api/v3/lego";
  function getApiKey() {
    return UnifiedDataManager.getApiKey();
  }
  function apiHeaders() {
    return { "Authorization": `key ${getApiKey()}`, "Accept": "application/json" };
  }

  // ── État courant ──────────────────────────────────────────────────────────
  let currentSetNumber = null;
  let currentSetData   = null;

  // ── Init ──────────────────────────────────────────────────────────────────
  function init() {
    applyTheme();
    renderSetsGrid();
    updateGlobalStats();
    // Bouton dark mode dans header
    const ha = document.getElementById("header-actions");
    ha.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="toggleDarkMode()">🌙</button>`;
  }

  // ── Recherche de set ──────────────────────────────────────────────────────
  let searchTimeout = null;
  async function onSetSearchInput(val) {
    clearTimeout(searchTimeout);
    if (val.length < 2) { hideSuggestions(); return; }
    searchTimeout = setTimeout(() => fetchSuggestions(val), 300);
  }

  async function fetchSuggestions(query) {
    const suggestEl = document.getElementById("set-suggestions");
    suggestEl.innerHTML = `<div class="suggestion-item loading">Recherche…</div>`;
    suggestEl.style.display = "block";

    let results = [];

    // 1. Priorité : API Rebrickable
    if (getApiKey()) {
      try {
        const url  = `${REBRICKABLE_API}/sets/?search=${encodeURIComponent(query)}&page_size=5`;
        const resp = await fetch(url, { headers: apiHeaders() });
        if (resp.ok) {
          const data = await resp.json();
          results = (data.results || []).map(s => ({
            set_num:   s.set_num,
            name:      s.name,
            year:      s.year,
            num_parts: s.num_parts,
            img_url:   s.set_img_url || "",
            source:    "api",
          }));
        }
      } catch (e) {
        console.warn("[sets] API search failed", e);
      }
    }

    // 2. Fallback : IndexedDB local
    if (results.length === 0) {
      results = await LegoDb.searchSetsLocal(query, 5);
      results = results.map(s => ({ ...s, source: "local" }));
    }

    if (results.length === 0) {
      suggestEl.innerHTML = `<div class="suggestion-item empty">Aucun résultat</div>`;
      return;
    }

    suggestEl.innerHTML = results.map(s => `
      <div class="suggestion-item" onclick="selectSet('${escapeHTML(s.set_num)}')">
        ${s.img_url ? `<img src="${escapeHTML(s.img_url)}" class="suggest-img" onerror="this.style.display='none'"/>` : ""}
        <div class="suggest-info">
          <strong>${escapeHTML(s.set_num)}</strong> — ${escapeHTML(s.name)}
          <small>${s.year || ""} · ${s.num_parts || "?"} pièces
            ${s.source === "local" ? '<span class="badge-local">local</span>' : ""}
          </small>
        </div>
      </div>
    `).join("");
  }

  function hideSuggestions() {
    document.getElementById("set-suggestions").style.display = "none";
  }
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrapper")) hideSuggestions();
  });

  function selectSet(setNum) {
    document.getElementById("set-search-input").value = setNum;
    hideSuggestions();
  }

  async function addSetFromInput() {
    const val = document.getElementById("set-search-input").value.trim();
    if (!val) return;
    const setNum = val.includes("-") ? val : val + "-1";
    await loadAndAddSet(setNum);
    document.getElementById("set-search-input").value = "";
  }

  // ── Chargement d'un set via API (priorité) + fallback IndexedDB ───────────

  async function loadAndAddSet(setNum) {
    // Déjà dans la collection ?
    if (UnifiedDataManager.getSet(setNum)) {
      showToast("Ce set est déjà dans votre collection.", "info");
      return;
    }

    showToast("Chargement du set " + setNum + "…", "info");

    let setData = null;

    // 1. Vérifier le cache IndexedDB d'abord
    const cached = await LegoDb.getCachedSet(setNum);
    if (cached && cached.parts && cached.parts.length > 0) {
      setData = cached;
      console.log("[sets] Set chargé depuis cache IndexedDB");
    }

    // 2. Sinon : API Rebrickable
    if (!setData && getApiKey()) {
      try {
        setData = await fetchSetFromApi(setNum);
      } catch (e) {
        console.warn("[sets] API failed for", setNum, e);
        showApiStatusMsg("⚠️ API indisponible, tentative IndexedDB…", "warning");
      }
    }

    // 3. Fallback IndexedDB
    if (!setData) {
      setData = await buildSetFromIndexedDB(setNum);
    }

    if (!setData) {
      showToast("Set introuvable : " + setNum, "error");
      return;
    }

    await UnifiedDataManager.saveSet(setData);
    renderSetsGrid();
    updateGlobalStats();
    showToast("Set ajouté : " + setData.name, "success");
    hideApiStatusMsg();
  }

  // ── API Rebrickable : récupération complète d'un set ──────────────────────

  async function fetchSetFromApi(setNum) {
    const headers = apiHeaders();
    if (!getApiKey()) throw new Error("Pas de clé API");

    // Infos générales du set
    const setResp = await fetch(`${REBRICKABLE_API}/sets/${setNum}/`, { headers });
    if (!setResp.ok) throw new Error(`HTTP ${setResp.status} pour set ${setNum}`);
    const setInfo = await setResp.json();

    // Pièces (avec pagination)
    const parts = await fetchAllPages(`${REBRICKABLE_API}/sets/${setNum}/parts/`, headers);

    // Minifigures
    let minifigParts = [];
    try {
      const figs = await fetchAllPages(`${REBRICKABLE_API}/sets/${setNum}/minifigs/`, headers);
      for (const fig of figs) {
        const figParts = await fetchAllPages(
          `${REBRICKABLE_API}/minifigs/${fig.set_num}/parts/`, headers
        );
        figParts.forEach(p => p._from_minifig = fig.set_num);
        minifigParts.push(...figParts);
      }
    } catch (e) {
      console.warn("[sets] Minifigs fetch failed", e);
    }

    // Normalisation des pièces
    const normalizePart = (p, isMinifig = false, isSpare = false) => ({
      part_num:       p.part?.part_num || "",
      name:           p.part?.name || "",
      color_id:       p.color?.id || 0,
      color_name:     p.color?.name || "",
      img_url:        p.part?.part_img_url || "",
      quantity:       p.quantity || 0,
      quantity_owned: 0,
      is_spare:       isSpare,
      is_minifig:     isMinifig,
    });

    const mainParts   = parts.filter(p => !p.is_spare).map(p => normalizePart(p, false, false));
    const spareParts  = parts.filter(p => p.is_spare) .map(p => normalizePart(p, false, true));
    const minifigNorm = minifigParts.map(p => normalizePart(p, true, false));

    const allParts = [...mainParts, ...minifigNorm, ...spareParts];

    const result = {
      number:    setInfo.set_num,
      name:      setInfo.name,
      year:      setInfo.year,
      num_parts: setInfo.num_parts,
      img_url:   setInfo.set_img_url || "",
      parts:     allParts,
    };

    // Enrichir l'autocomplétion IndexedDB avec l'image récupérée
    await LegoDb.enrichSetAutocomplete(setInfo.set_num, {
      img_url: setInfo.set_img_url || "",
    }).catch(() => {});

    return result;
  }

  async function fetchAllPages(baseUrl, headers) {
    let results = [];
    let url     = baseUrl + (baseUrl.includes("?") ? "&" : "?") + "page_size=100";
    while (url) {
      const resp = await fetch(url, { headers });
      if (!resp.ok) throw new Error(`HTTP ${resp.status} pour ${url}`);
      const data = await resp.json();
      results.push(...(data.results || []));
      url = data.next || null;
    }
    return results;
  }

  // ── Fallback IndexedDB ────────────────────────────────────────────────────

  async function buildSetFromIndexedDB(setNum) {
    const autocomplete = await LegoDb.getSetAutocomplete(setNum);
    // On ne peut pas reconstruire les pièces depuis IndexedDB sans la table inventories
    // On retourne au minimum les métadonnées pour un set "vide"
    if (!autocomplete) return null;
    return {
      number:    autocomplete.set_num,
      name:      autocomplete.name || "",
      year:      autocomplete.year || 0,
      num_parts: autocomplete.num_parts || 0,
      img_url:   autocomplete.img_url || "",
      parts:     [], // nécessite l'API pour les pièces
    };
  }

  // ── Rendu de la grille des sets ───────────────────────────────────────────

  function renderSetsGrid() {
    const sets  = UnifiedDataManager.getSets();
    const grid  = document.getElementById("sets-grid");
    if (sets.length === 0) {
      grid.innerHTML = `<p class="empty-state">Aucun set. Recherchez un numéro de set ci-dessus.</p>`;
      return;
    }
    grid.innerHTML = sets.map(s => {
      const total   = s.parts.filter(p => !p.is_spare).length;
      const owned   = s.parts.filter(p => !p.is_spare && p.quantity_owned >= p.quantity).length;
      const pct     = total > 0 ? Math.round((owned / total) * 100) : 0;
      const complete = pct === 100;
      return `
        <div class="set-card ${complete ? "set-complete" : ""}" onclick="openSetDetail('${escapeHTML(s.number)}')">
          <img src="${escapeHTML(s.img_url)}" alt="${escapeHTML(s.name)}"
               class="set-card-img" onerror="this.src='data:image/svg+xml,${encodeURIComponent(placeholderSVG())}'"/>
          <div class="set-card-info">
            <p class="set-card-number">${escapeHTML(s.number)}</p>
            <p class="set-card-name">${escapeHTML(s.name)}</p>
            <p class="set-card-meta">${s.year || ""} · ${s.num_parts || s.parts.length} pièces</p>
            <div class="progress-bar-container">
              <div class="progress-bar" style="width:${pct}%"></div>
            </div>
            <p class="progress-label">${owned}/${total} (${pct}%)</p>
          </div>
        </div>`;
    }).join("");
  }

  function updateGlobalStats() {
    const stats = UnifiedDataManager.getStats();
    document.getElementById("stat-total").textContent      = stats.totalSets;
    document.getElementById("stat-complete").textContent   = stats.completeSets;
    document.getElementById("stat-incomplete").textContent = stats.incompleteSets;
  }

  // ── Vue détail d'un set ───────────────────────────────────────────────────

  async function openSetDetail(setNum) {
    currentSetNumber = setNum;
    currentSetData   = UnifiedDataManager.getSet(setNum);
    if (!currentSetData) return;

    document.getElementById("view-sets").style.display      = "none";
    document.getElementById("view-set-detail").style.display = "block";
    document.getElementById("page-title").textContent       = currentSetData.number;

    document.getElementById("detail-name").textContent = currentSetData.name;
    document.getElementById("detail-meta").textContent =
      `${currentSetData.year || ""} · ${currentSetData.num_parts || ""} pièces`;

    const imgEl = document.getElementById("detail-img");
    imgEl.src = currentSetData.img_url || "";
    imgEl.style.display = currentSetData.img_url ? "block" : "none";

    renderPartsList();
  }

  function renderPartsList() {
    if (!currentSetData) return;
    const hideCompleted = document.getElementById("hide-completed").checked;
    const mainParts  = currentSetData.parts.filter(p => !p.is_spare);
    const spareParts = currentSetData.parts.filter(p => p.is_spare);

    const total  = mainParts.reduce((s, p) => s + p.quantity, 0);
    const owned  = mainParts.reduce((s, p) => s + Math.min(p.quantity_owned, p.quantity), 0);
    const pct    = total > 0 ? Math.round((owned / total) * 100) : 0;

    document.getElementById("detail-progress").style.width = pct + "%";
    document.getElementById("detail-progress-label").textContent =
      `${owned} / ${total} pièces (${pct}%)`;

    const renderRows = (parts) => parts
      .filter(p => !hideCompleted || p.quantity_owned < p.quantity)
      .map(p => {
        const missing = p.quantity - p.quantity_owned;
        const invQty  = UnifiedDataManager.getInventoryQuantity(p.part_num, p.color_id);
        return `<tr class="${p.quantity_owned >= p.quantity ? "row-complete" : ""}">
          <td><img src="${escapeHTML(p.img_url || "")}" class="part-thumb"
               onerror="this.src='data:image/svg+xml,${encodeURIComponent(placeholderSVG())}'"/></td>
          <td>
            <span class="part-num">${escapeHTML(p.part_num)}</span>
            <span class="part-name">${escapeHTML(p.name || "")}</span>
            ${p.is_minifig ? '<span class="badge badge-minifig">Minifig</span>' : ""}
          </td>
          <td><span class="color-chip" style="background:#${getColorHex(p.color_id)}"></span>${escapeHTML(p.color_name || String(p.color_id))}</td>
          <td>${p.quantity}</td>
          <td>
            <div class="qty-control">
              <button class="btn-qty" onclick="changePartQty('${escapeHTML(p.part_num)}',${p.color_id},-1)">−</button>
              <span>${p.quantity_owned}</span>
              <button class="btn-qty" onclick="changePartQty('${escapeHTML(p.part_num)}',${p.color_id},+1)">+</button>
            </div>
          </td>
          <td>
            ${missing > 0 && invQty > 0
              ? `<button class="btn btn-sm btn-primary" onclick="transferFromInventory('${escapeHTML(p.part_num)}',${p.color_id},${missing})">
                  Transférer (${Math.min(invQty, missing)})
                </button>`
              : missing > 0 ? `<span class="missing-badge">−${missing}</span>` : ""}
          </td>
        </tr>`;
      }).join("");

    document.getElementById("parts-tbody").innerHTML    = renderRows(mainParts);
    const sparesContainer = document.getElementById("spares-container");
    if (spareParts.length > 0) {
      document.getElementById("spares-tbody").innerHTML = renderRows(spareParts);
      sparesContainer.style.display = "block";
    } else {
      sparesContainer.style.display = "none";
    }
  }

  function changePartQty(partNum, colorId, delta) {
    if (!currentSetData) return;
    const part = currentSetData.parts.find(
      p => p.part_num === partNum && p.color_id === parseInt(colorId)
    );
    if (!part) return;
    const newQty = Math.max(0, Math.min(part.quantity, part.quantity_owned + delta));
    UnifiedDataManager.updateSetPartQuantity(currentSetNumber, partNum, colorId, newQty);
    currentSetData = UnifiedDataManager.getSet(currentSetNumber);
    renderPartsList();
  }

  function completeAllParts() {
    if (!currentSetData) return;
    currentSetData.parts.forEach(p => {
      UnifiedDataManager.updateSetPartQuantity(currentSetNumber, p.part_num, p.color_id, p.quantity);
    });
    currentSetData = UnifiedDataManager.getSet(currentSetNumber);
    renderPartsList();
  }

  function resetAllParts() {
    if (!currentSetData || !confirm("Remettre toutes les quantités à zéro ?")) return;
    currentSetData.parts.forEach(p => {
      UnifiedDataManager.updateSetPartQuantity(currentSetNumber, p.part_num, p.color_id, 0);
    });
    currentSetData = UnifiedDataManager.getSet(currentSetNumber);
    renderPartsList();
  }

  function transferFromInventory(partNum, colorId, missing) {
    const result = UnifiedDataManager.transferPartToSet(currentSetNumber, partNum, colorId, missing);
    if (result.success) {
      currentSetData = UnifiedDataManager.getSet(currentSetNumber);
      renderPartsList();
      showToast(`${result.transferred} pièce(s) transférée(s) depuis l'inventaire.`, "success");
    } else {
      showToast("Transfert impossible : " + result.error, "error");
    }
  }

  function deleteCurrentSet() {
    if (!confirm(`Supprimer le set ${currentSetNumber} ?`)) return;
    UnifiedDataManager.removeSet(currentSetNumber);
    showSetsView();
    showToast("Set supprimé.", "info");
  }

  function showSetsView() {
    document.getElementById("view-set-detail").style.display = "none";
    document.getElementById("view-sets").style.display       = "block";
    document.getElementById("page-title").textContent        = "Mes Sets";
    currentSetNumber = null;
    currentSetData   = null;
    renderSetsGrid();
    updateGlobalStats();
  }

  // ── Pièces manquantes globales ────────────────────────────────────────────

  function toggleMissingParts() {
    const section = document.getElementById("missing-parts-section");
    const visible = section.style.display !== "none";
    if (!visible) {
      section.style.display = "block";
      renderMissingParts();
    } else {
      section.style.display = "none";
    }
  }

  function renderMissingParts() {
    const sets = UnifiedDataManager.getSets();
    const missingMap = new Map();

    sets.forEach(s => {
      s.parts.filter(p => !p.is_spare && p.quantity_owned < p.quantity).forEach(p => {
        const key  = `${p.part_num}_${p.color_id}`;
        const miss = p.quantity - p.quantity_owned;
        if (!missingMap.has(key)) {
          missingMap.set(key, { ...p, totalMissing: 0, sets: [] });
        }
        const entry = missingMap.get(key);
        entry.totalMissing += miss;
        entry.sets.push({ number: s.number, name: s.name, missing: miss });
      });
    });

    const list = document.getElementById("missing-parts-list");
    if (missingMap.size === 0) {
      list.innerHTML = "<p class='empty-state'>🎉 Tous les sets sont complets !</p>";
      return;
    }
    list.innerHTML = [...missingMap.values()].map(p => {
      const invQty = UnifiedDataManager.getInventoryQuantity(p.part_num, p.color_id);
      return `<div class="missing-part-row">
        <img src="${escapeHTML(p.img_url || "")}" class="part-thumb-sm" onerror="this.style.display='none'"/>
        <div class="missing-part-info">
          <strong>${escapeHTML(p.part_num)}</strong> ${escapeHTML(p.name || "")}
          <small>Couleur ${escapeHTML(p.color_name || String(p.color_id))}</small>
          <small>Manquant : ${p.totalMissing} · En inventaire : ${invQty}</small>
          <small>Sets : ${p.sets.map(s => escapeHTML(s.number)).join(", ")}</small>
        </div>
        ${invQty > 0
          ? `<button class="btn btn-sm btn-primary" onclick="transferMissingToSet('${escapeHTML(p.part_num)}',${p.color_id},'${escapeHTML(p.sets[0].number)}',${p.totalMissing})">
              Transférer
            </button>`
          : ""}
      </div>`;
    }).join("");
  }

  function transferMissingToSet(partNum, colorId, setNum, qty) {
    const result = UnifiedDataManager.transferPartToSet(setNum, partNum, colorId, qty);
    if (result.success) {
      renderMissingParts();
      renderSetsGrid();
      showToast(`${result.transferred} pièce(s) transférée(s).`, "success");
    } else {
      showToast(result.error, "error");
    }
  }

  // ── Import / Export ───────────────────────────────────────────────────────

  function showImportExport() {
    document.getElementById("modal-ie").style.display = "flex";
  }
  function closeModal() {
    document.getElementById("modal-ie").style.display = "none";
  }

  function exportJSON() {
    const json = UnifiedDataManager.exportData();
    const blob = new Blob([json], { type: "application/json" });
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = `gbm_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function exportCSV() {
    const sets = UnifiedDataManager.getSets();
    const rows = [["Set","Pièce","Couleur","Qté manquante"]];
    sets.forEach(s => {
      s.parts.filter(p => !p.is_spare && p.quantity_owned < p.quantity).forEach(p => {
        rows.push([s.number, p.part_num, p.color_id, p.quantity - p.quantity_owned]);
      });
    });
    const csv  = rows.map(r => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = `gbm_missing_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  function importJSON(input) {
    const file   = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        UnifiedDataManager.importData(e.target.result);
        renderSetsGrid();
        updateGlobalStats();
        closeModal();
        showToast("Import réussi.", "success");
      } catch (err) {
        showToast("Erreur import : " + err.message, "error");
      }
    };
    reader.readAsText(file);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────

  function showApiStatusMsg(msg, type) {
    const el = document.getElementById("api-status-msg");
    el.textContent  = msg;
    el.className    = `api-status ${type}`;
    el.style.display = "block";
  }
  function hideApiStatusMsg() {
    document.getElementById("api-status-msg").style.display = "none";
  }

  const _colorCache = new Map();
  function getColorHex(colorId) {
    if (_colorCache.has(colorId)) return _colorCache.get(colorId);
    // Fallback synchrone (couleurs chargées depuis DB au démarrage si possible)
    return "cccccc";
  }
  // Préchargement des couleurs depuis IndexedDB
  LegoDb.getAllColors().then(colors => {
    colors.forEach(c => _colorCache.set(c.id, c.rgb || "cccccc"));
  }).catch(() => {});

  function placeholderSVG() {
    return `<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><rect width='60' height='60' fill='%23eee'/><text x='30' y='35' text-anchor='middle' fill='%23999' font-size='10'>?</text></svg>`;
  }
  function escapeHTML(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function showToast(msg, type = "info") {
    const t = document.createElement("div");
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add("show"), 10);
    setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 400); }, 4000);
  }
  function applyTheme() {
    if (UnifiedDataManager.getPreference("theme") === "dark") document.body.classList.add("dark");
  }
  function toggleDarkMode() {
    document.body.classList.toggle("dark");
    UnifiedDataManager.setPreference("theme", document.body.classList.contains("dark") ? "dark" : "light");
  }

  init();
  </script>
</body>
